name: Apply SQL to the database

# Runs a .sql file from this repo against the Supabase database, so schema
# changes and one-off fixes stop being "paste this into the SQL editor".
#
# schema.sql is idempotent, so re-running it is always safe — it is applied
# automatically whenever it changes on main. Anything else is run on demand
# from the Actions tab, which means every statement ever run against the
# database exists in this repo first, reviewable in the diff.
#
# One-time setup: add a repository secret named SUPABASE_DB_URL.
#   Supabase -> "Connect" button at the top of the project dashboard
#   -> use the SESSION POOLER string (port 5432), not "Direct connection":
#      postgres://postgres.<ref>:<password>@aws-<region>.pooler.supabase.com:5432/postgres
#   GitHub runners are IPv4 only; the direct connection is IPv6 only unless
#   the project has the IPv4 add-on, so it cannot reach the database from CI.
#   Transaction pooler (6543) does not support the prepared statements psql
#   uses, so session mode is the one that works here.
#   Then: repo Settings -> Secrets and variables -> Actions -> New secret.
# The secret is never printed and never leaves GitHub.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "SQL file to run, relative to the repo root"
        required: true
        default: "schema.sql"
  push:
    branches: [main]
    paths: ["schema.sql"]

permissions:
  contents: read

concurrency:
  group: apply-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the connection secret is set
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings > Secrets and variables > Actions."
            echo "Supabase > Project Settings > Database > Connection string > URI"
            exit 1
          fi
          echo "Secret is present."

      - name: Pick the file
        id: pick
        run: |
          FILE="${{ github.event.inputs.file }}"
          [ -z "$FILE" ] && FILE="schema.sql"
          # stay inside the repo and only ever run .sql
          case "$FILE" in
            /*|*..*) echo "::error::Refusing path outside the repo: $FILE"; exit 1 ;;
            *.sql)   ;;
            *)       echo "::error::Not a .sql file: $FILE"; exit 1 ;;
          esac
          if [ ! -f "$FILE" ]; then
            echo "::error::No such file in the repo: $FILE"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Will run: $FILE"

      - name: Run it
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "--- ${{ steps.pick.outputs.file }} ---"
          cat "${{ steps.pick.outputs.file }}"
          echo "--- applying ---"
          # ON_ERROR_STOP so a failed statement fails the run instead of
          # leaving the schema half-applied and the job green.
          if ! psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -f "${{ steps.pick.outputs.file }}"; then
            echo "::error::psql failed — nothing was applied (the whole file runs in one transaction)."
            case "$PGURL" in
              *db.*.supabase.co*)
                echo "::error::That looks like the DIRECT connection string. It is IPv6 only, and GitHub runners are IPv4 only."
                echo "Use the Session pooler string instead: Supabase > Connect > Session pooler (port 5432)." ;;
              *:6543/*)
                echo "::error::That is the TRANSACTION pooler (port 6543), which does not support the prepared statements psql uses."
                echo "Use the Session pooler string instead (port 5432)." ;;
              *) echo "Check that SUPABASE_DB_URL is the Session pooler URI with the password filled in." ;;
            esac
            exit 1
          fi
          echo "Applied cleanly."
